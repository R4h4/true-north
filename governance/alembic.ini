# Alembic config for the governance runtime store (ADR 0010).
#
# Alembic owns the Postgres DDL (roles, users, policy_config, audit_log). It is a
# DEPLOY-TIME tool only — `python -m governance.pg` runs `alembic upgrade head`
# programmatically before hydrating, and the runtime `tn` CLI never imports it
# (SQLAlchemy stays off the hot path). The DSN is NOT set here; env.py resolves it
# via governance.pg.resolve_dsn() so TN_PG_DSN is honored.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
