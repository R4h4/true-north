[project]
name = "true-north-governance"
version = "0.1.0"
description = "Data-governance layer: RLS, column masking, PII tokenization, table access; the governed CLI"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "duckdb>=1.1",
    "sqlglot>=25",
    "pyyaml>=6",
    "true-north-source",
    "true-north-knowledge-graph",
]

[project.scripts]
tn = "governance.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["governance"]

[tool.uv.sources]
true-north-source = { workspace = true }
true-north-knowledge-graph = { workspace = true }
