# Neo4j for the true-north knowledge graph.
# Graph contents are a build artifact (ADR 0005): `knowledge_graph.compile`
# does a full wipe-and-rebuild against this instance. The browser at :7474 is
# for human exploration only — permission annotations exist only via the CLI
# and nothing observed over raw bolt is contractual (CONTRACT.md).
#
# Bring-up:  docker compose up -d   (see knowledge-graph/README.md)
services:
  neo4j:
    image: neo4j:5-community
    container_name: true-north-neo4j
    ports:
      - "7474:7474"   # HTTP browser UI
      - "7687:7687"   # bolt
    environment:
      # Fixed dev credentials — this is a local demo instance, no real auth (non-goal).
      NEO4J_AUTH: "${NEO4J_AUTH:-neo4j/true-north-dev}"
      NEO4J_server_memory_pagecache_size: "256M"
      NEO4J_server_memory_heap_max__size: "512M"
    volumes:
      - neo4j-data:/data
    healthcheck:
      # cypher-shell round-trip proves bolt is actually accepting queries,
      # not just that the port is open.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_PASSWORD:-true-north-dev}\" 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  # Postgres for the runtime policy store + query-audit log (ADR 0010).
  # Same compile-from-authored-YAML pattern as Neo4j (ADR 0005): users.yaml is
  # the authored source, `python -m governance.pg` hydrates this at deploy time,
  # and the CLI reads personas/roles from here at runtime. audit_log rows are
  # written fail-open on every `tn` invocation. Nothing here is contractual.
  postgres:
    image: postgres:16-alpine
    container_name: true-north-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: truenorth
      POSTGRES_PASSWORD: truenorth
      POSTGRES_DB: truenorth
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truenorth -d truenorth"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  neo4j-data:
  postgres-data:
