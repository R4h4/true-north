[project]
name = "true-north-knowledge-graph"
version = "0.1.0"
description = "Business knowledge graph on Neo4j: glossary, concepts, compiled semantic layer + permissions"
requires-python = ">=3.12"
dependencies = [
    "neo4j>=5.20",
    "pyyaml>=6",
    "true-north-source",
    "true-north-governance",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["knowledge_graph"]

[tool.uv.sources]
true-north-source = { workspace = true }
true-north-governance = { workspace = true }
