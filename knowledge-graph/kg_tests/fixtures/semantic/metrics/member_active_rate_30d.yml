key: member_active_rate_30d
name: Member active rate (30d)
short_description: Loyalty members active in last 30 days
description: >
  Share of loyalty members with any purchase activity in the 30 days ending at
  the latest sales timestamp. Denominator is the set of loyalty members
  (dim_customer); numerator is those with a non-NULL customer_id purchase in the
  trailing 30-day window. A ratio in [0, 1].
concept: member-activity-retention
type: ratio
unit: ratio
version: "0.1"
formula: "members active in last 30d / all loyalty members"
time_dimension: date
dimensions: [channel]
compute:
  measures:
    active_members:
      table: fact_sales_lines
      expr: customer_id
      agg: count_distinct
      time_column: ts
    all_members:
      table: dim_customer
      expr: customer_id
      agg: count_distinct
      time_column: joined_date
  expr: "active_members / all_members"
  template: member_active_rate_30d
