key: basket_items_avg
name: Average basket size (items)
short_description: Mean item count per basket
description: >
  Mean number of units per basket: total units sold (SUM of qty) divided by the
  count of distinct baskets. This is the item-count reading of "basket size" — a
  different story from the value reading (basket_value_avg), because B2B baskets
  have huge value but their item counts differ.
concept: basket-items
type: derived
unit: count
version: "0.1"
formula: "SUM(qty) / COUNT(DISTINCT basket_id)"
time_dimension: date
dimensions: [channel, region, province, category, subcategory, brand, store_format, tier, customer_type]
compute:
  measures:
    units:
      table: fact_sales_lines
      expr: qty
      agg: sum
      time_column: ts
      joins:
        - {table: dim_store, left_on: store_id, right_on: store_id}
        - {table: dim_sku, left_on: sku_id, right_on: sku_id}
        - {table: dim_customer, left_on: customer_id, right_on: customer_id}
    baskets:
      table: fact_sales_lines
      expr: basket_id
      agg: count_distinct
      time_column: ts
      joins:
        - {table: dim_store, left_on: store_id, right_on: store_id}
        - {table: dim_sku, left_on: sku_id, right_on: sku_id}
        - {table: dim_customer, left_on: customer_id, right_on: customer_id}
  expr: "units / baskets"
