key: same_store_sales_growth
name: Same-store sales growth
short_description: Like-for-like net revenue growth
description: >
  Year-over-year growth in net revenue restricted to like-for-like stores: only
  stores open for the full comparison period (opened ≥ 13 months before the
  period start and not closed before the period end) count. Excludes footprint
  change (new/closed stores) so growth reflects organic performance, not store
  openings. A ratio (may be negative).
concept: same-store-growth
type: ratio
unit: ratio
version: "0.1"
formula: "(net_revenue this period − net_revenue prior year, same stores) / prior"
time_dimension: date
dimensions: [region, channel]
compute:
  measures:
    net_current:
      table: fact_sales_lines
      expr: net_amount
      agg: sum
      time_column: ts
    net_prior:
      table: fact_sales_lines
      expr: net_amount
      agg: sum
      time_column: ts
  expr: "net_current / net_prior"
  template: same_store_sales_growth
