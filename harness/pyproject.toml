[project]
name = "true-north-harness"
version = "0.1.0"
description = "The agent on top: chat interface consuming the governed CLI"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.2",
    "strands-agents[openai,otel]>=1.47.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
