[tool.uv.workspace]
members = ["source", "governance", "knowledge-graph", "harness"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["contracts/conformance", "governance/tests"]
# The conformance conftest imports `from conftest import invoke_cli`; adding its
# directory to the path makes that resolve regardless of rootdir.
pythonpath = ["contracts/conformance"]
