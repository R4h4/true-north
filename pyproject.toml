[project]
name = "true_north"
version = "0.1.0"
description = "Governed natural-language-to-SQL self-service BI demo dataset (Phong Vu retail)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=18",
    "numpy>=2",
    "faker>=33",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generator"]
