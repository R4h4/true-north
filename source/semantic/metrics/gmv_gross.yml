key: gmv_gross
name: GMV (gross)
short_description: Gross merchandise value before returns
description: >
  Gross merchandise value: the sum of booked net_amount on fact_sales_lines (line
  revenue after line discounts) BEFORE any returns are subtracted. This is the
  "revenue as booked" figure. It is gross of returns (fact_returns is not touched)
  and B2B-inclusive by default — state whether B2B is included, since a few very
  large B2B baskets dominate total value.
concept: gmv-gross
type: sum
unit: VND
version: "0.1"
formula: "SUM(net_amount)"
time_dimension: date
dimensions: [channel, region, province, category, subcategory, brand, store_format, tier, customer_type]
compute:
  measures:
    gmv:
      table: fact_sales_lines
      expr: net_amount
      agg: sum
      time_column: ts
      joins:
        - {table: dim_store, left_on: store_id, right_on: store_id}
        - {table: dim_sku, left_on: sku_id, right_on: sku_id}
        - {table: dim_customer, left_on: customer_id, right_on: customer_id}
  expr: "gmv"
