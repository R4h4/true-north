key: net_revenue
name: Net revenue
short_description: Sales net of returns
description: >
  Booked revenue (SUM of fact_sales_lines.net_amount, already net of line
  discounts) MINUS refunds from fact_returns. Returns are material and
  category-dependent — high for PC Component (DOA / incompatible), low for
  Accessory — so category-level net revenue and rankings differ from gross.
  B2B-inclusive by default; state whether B2B is included.
concept: net-revenue
type: derived
unit: VND
version: "0.1"
formula: "SUM(net_amount) - SUM(refund_amount)"
time_dimension: date
dimensions: [channel, region, province, category, subcategory, brand, store_format, tier, customer_type]
compute:
  measures:
    sales_net:
      table: fact_sales_lines
      expr: net_amount
      agg: sum
      time_column: ts
      joins:
        - {table: dim_store, left_on: store_id, right_on: store_id}
        - {table: dim_sku, left_on: sku_id, right_on: sku_id}
        - {table: dim_customer, left_on: customer_id, right_on: customer_id}
    returns_refund:
      table: fact_returns
      expr: refund_amount
      agg: sum
      time_column: return_date
      joins:
        - {table: fact_sales_lines, left_on: orig_basket_id, right_on: basket_id}
        - {table: dim_store, left_on: fact_sales_lines.store_id, right_on: store_id}
        - {table: dim_sku, left_on: sku_id, right_on: sku_id}
  expr: "sales_net - returns_refund"
