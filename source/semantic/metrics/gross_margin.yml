key: gross_margin
name: Gross margin
short_description: Net revenue minus cost of goods
description: >
  Net revenue minus cost of goods sold, before operating costs. Realized COGS is
  taken from fact_sales_lines.cost_amount (the transacted cost on the line), never
  from dim_sku.unit_cost (a list value). Net of returns: refunds reduce revenue.
  Reads the cost_amount column, so it is denied to roles for which cost is masked.
concept: gross-margin
type: derived
unit: VND
version: "0.1"
formula: "SUM(net_amount) - SUM(cost_amount) - SUM(refund_amount)"
time_dimension: date
dimensions: [channel, region, province, category, subcategory, brand, store_format]
compute:
  measures:
    sales_net:
      table: fact_sales_lines
      expr: net_amount
      agg: sum
      time_column: ts
      joins:
        - {table: dim_store, left_on: store_id, right_on: store_id}
        - {table: dim_sku, left_on: sku_id, right_on: sku_id}
    sales_cost:
      table: fact_sales_lines
      expr: cost_amount
      agg: sum
      time_column: ts
      joins:
        - {table: dim_store, left_on: store_id, right_on: store_id}
        - {table: dim_sku, left_on: sku_id, right_on: sku_id}
    returns_refund:
      table: fact_returns
      expr: refund_amount
      agg: sum
      time_column: return_date
      joins:
        - {table: fact_sales_lines, distinct_key: basket_id, carry: [channel, store_id], left_on: orig_basket_id, right_on: basket_id}
        - {table: dim_store, left_on: fact_sales_lines.store_id, right_on: store_id}
        - {table: dim_sku, left_on: fact_returns.sku_id, right_on: sku_id}
  expr: "sales_net - sales_cost - returns_refund"
