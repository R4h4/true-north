[project]
name = "true-north-source"
version = "0.1.0"
description = "Mocked data warehouse (DuckDB) + semantic layer with governed metrics, exposed via a DSL/CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=18",
    "numpy>=2",
    "faker>=33",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generator", "query"]
