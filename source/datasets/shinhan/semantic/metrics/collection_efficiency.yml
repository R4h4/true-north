key: collection_efficiency
name: Collection efficiency
short_description: Share of amount due actually collected.
description: >
  SUM(amount_collected) / SUM(amount_due) from fact_collections. bucket_at_due is the
  DPD bucket at the START of the collections month, which differs from
  fact_loan_snapshots' month-end dpd_bucket for the same calendar month (bucket
  migration during the month) — do not join or compare the two bucket fields as if
  they were the same value.
concept: collection-efficiency
type: ratio
unit: ratio
version: "0.1"
formula: "SUM(amount_collected) / SUM(amount_due)"
time_dimension: month
dimensions: [product, channel, province]
compute:
  measures:
    collected_sum:
      table: fact_collections
      expr: amount_collected
      agg: sum
      time_column: month
      joins:
        - {table: fact_disbursements, left_on: loan_id, right_on: loan_id}
        - {table: dim_customer, left_on: fact_disbursements.customer_id, right_on: customer_id}
    due_sum:
      table: fact_collections
      expr: amount_due
      agg: sum
      time_column: month
      joins:
        - {table: fact_disbursements, left_on: loan_id, right_on: loan_id}
        - {table: dim_customer, left_on: fact_disbursements.customer_id, right_on: customer_id}
  expr: "collected_sum / due_sum"
