key: enr
name: Earning net receivables (ENR)
short_description: Outstanding principal at a snapshot month.
description: >
  SUM(outstanding_principal) from fact_loan_snapshots at a given snapshot month,
  status = active only. fact_loan_snapshots is a MONTH-END periodic snapshot — this
  metric is NON-ADDITIVE across months; summing enr over several snapshot_months
  double-counts the same outstanding balances. Always pick a single snapshot_month (or
  the latest) before summing across any other dimension.
concept: enr
type: sum
unit: VND
version: "0.1"
formula: "SUM(outstanding_principal) WHERE status = 'active'"
time_dimension: month
dimensions: [product, channel, province, dpd_bucket]
compute:
  measures:
    outstanding_sum:
      table: fact_loan_snapshots
      expr: outstanding_principal
      agg: sum
      time_column: snapshot_month
      filters:
        - {column: status, operator: "=", value: active}
      joins:
        - {table: fact_disbursements, left_on: loan_id, right_on: loan_id}
        - {table: dim_customer, left_on: fact_disbursements.customer_id, right_on: customer_id}
        - {table: dim_product, left_on: fact_disbursements.product_key, right_on: product_key}
        - {table: dim_channel, left_on: fact_disbursements.channel, right_on: channel_key}
  expr: "outstanding_sum"
